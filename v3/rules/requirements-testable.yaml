id: requirements/testable
kind: judgment
phase: [inception]
checkpoint: exit
substrate: [artifacts]
check: artifact.items_missing_marker
params:
  artifact: requirements.md
  label: observable condition
  markers:
    - "given .*, *when .*, *then"
    - "within [0-9]+ *(ms|s|seconds|minutes)"
    - "returns? (a |an )?[0-9]{3}"
principle: >
  A requirement should describe an observable condition rather than a goal.
  "Fast login" is a goal; "login responds within 500ms at p95" is testable.
severity: warn
fix: suggest
